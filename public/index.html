const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let me=null,tab='home',people=[],friends=[],rooms=[],chatWith=null,authMode='register';const api=async(path,body)=>{let r=await fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:body===undefined?undefined:JSON.stringify(body)});let x=await r.json();if(!r.ok)throw Error(x.error||'Something went wrong');return x};function msg(s){alert(s)}

async function closeCall(notify=true){
  const other=callPeer;
  callPeer=null;
  const oldPeer=peer;peer=null;
  if(oldPeer)oldPeer.close();
  const oldStream=callStream;callStream=null;
  if(oldStream)oldStream.getTracks().forEach(t=>t.stop());
  document.getElementById('calloverlay')?.remove();
  pendingIce=[];
  // Close locally immediately, even if the signaling request is slow.
  if(notify&&other)signal(other,'hangup').catch(e=>console.warn('Hangup signaling:',e));
}

async function callPanel(mode,person){await closeCall(false);callPeer=person.id;callMode=mode;let overlay=document.createElement('div');overlay.className='calloverlay';overlay.id='calloverlay';overlay.innerHTML=`<div class="callpanel" role="dialog" aria-modal="true"><h2>${mode==='video'?'📹 Video':'📞 Audio'} Call</h2><h3>${esc(person.name)}</h3><p class="muted">Real-time peer-to-peer call · Both users must be online</p><video id="remoteVideo" autoplay playsinline style="width:100%;max-height:220px"></video><video id="localPreview" autoplay muted playsinline ${mode==='audio'?'style="display:none"':''}></video><div id="callStatus" class="muted">Connecting…</div><div class="callcontrols"><button class="btn alt" id="toggleMic">🎤 Mute</button>${mode==='video'?'<button class="btn alt" id="toggleCam">📷 Camera off</button>':''}<button class="btn" id="endCall">🔴 End</button></div></div>`;document.body.appendChild(overlay);overlay.querySelector('#endCall').onclick=()=>closeCall();try{const acquired=await navigator.mediaDevices.getUserMedia({audio:true,video:mode==='video'});if(callPeer!==person.id||!document.getElementById('calloverlay')){acquired.getTracks().forEach(t=>t.stop());return}callStream=acquired;overlay.querySelector('#localPreview').srcObject=callStream;peer=new RTCPeerConnection(rtcConfig);callStream.getTracks().forEach(t=>peer.addTrack(t,callStream));peer.ontrack=e=>{let v=document.getElementById('remoteVideo');if(v)v.srcObject=e.streams[0]};peer.onicecandidate=e=>{if(e.candidate)signal(callPeer,'ice',e.candidate.toJSON()).catch(()=>{})};peer.onconnectionstatechange=()=>callStatus(peer?.connectionState==='connected'?'Connected 🎉':peer?.connectionState||'Disconnected');overlay.querySelector('#toggleMic').onclick=e=>{let t=callStream.getAudioTracks()[0];t.enabled=!t.enabled;e.currentTarget.textContent=t.enabled?'🎤 Mute':'🔇 Unmute'};let cam=overlay.querySelector('#toggleCam');if(cam)cam.onclick=e=>{let t=callStream.getVideoTracks()[0];t.enabled=!t.enabled;e.currentTarget.textContent=t.enabled?'📷 Camera off':'📷 Camera on'}}catch(e){callStatus('Device error: '+e.message)}}
async function openCall(mode,person){if(person.demo){alert('DEMO profiles cannot receive calls. Register another real account on a second device.');return}if(!window.isSecureContext){alert('Camera and microphone require HTTPS (or localhost).');return}await callPanel(mode,person);if(!peer)return;try{let offer=await peer.createOffer();await peer.setLocalDescription(offer);await signal(person.id,'offer',{sdp:peer.localDescription,mode});callStatus('Ringing '+person.name+'…')}catch(e){callStatus(e.message)}}
async function callEvents(){if(!me)return;try{let res=await api('call/events?since='+callPollSeq);for(let ev of res.events){callPollSeq=Math.max(callPollSeq,ev.seq);if(ev.type==='offer'){if(callPeer){await signal(ev.from,'reject');continue}let person={id:ev.from,name:ev.name};if(!confirm(`${ev.name} is calling (${ev.payload.mode}). Accept?`)){await signal(ev.from,'reject');continue}await callPanel(ev.payload.mode,person);if(!peer)continue;await peer.setRemoteDescription(ev.payload.sdp);let answer=await peer.createAnswer();await peer.setLocalDescription(answer);await signal(ev.from,'answer',{sdp:peer.localDescription});callStatus('Connecting…')}else if(ev.from===callPeer&&peer){if(ev.type==='answer'){await peer.setRemoteDescription(ev.payload.sdp);for(let c of pendingIce)await peer.addIceCandidate(c);pendingIce=[]}else if(ev.type==='ice'){if(peer.remoteDescription)await peer.addIceCandidate(ev.payload);else pendingIce.push(ev.payload)}else if(ev.type==='hangup'||ev.type==='reject'){await closeCall(false);alert(ev.type==='reject'?'Call declined':'Call ended')}}}}catch(e){console.warn('Call signaling:',e)}}
setInterval(callEvents,1200);
async function showMessages(){let id=chatWith;try{let items=(await api('messages?with='+id)).messages;if(id!==chatWith)return;let el=$('#messages');if(!el)return;el.innerHTML=items.length?items.map(m=>`<div class="bubble ${m.sender===me.id?'mine':''}">${esc(m.body)}<div style="font-size:10px;opacity:.65;margin-top:5px">${esc(m.created)}</div></div>`).join(''):'<div class="muted">No messages yet. Say hi 👋</div>';el.scrollTop=el.scrollHeight}catch(e){}}
(async()=>{try{me=(await api('me')).user;if(me)await load()}catch(e){}render()})();setInterval(()=>{if(me&&tab==='chat'&&chatWith)showMessages()},3500);
</script></body></html>
