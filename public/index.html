<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINGLE · Find your people</title><style>
:root{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;color:#f8f7ff;background:#0c0920}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#432273 0,transparent 50%),#0c0920;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.shell{max-width:1250px;margin:auto;display:flex;min-height:100vh}.side{width:260px;flex-shrink:0;border-right:1px solid #ffffff16;padding:30px 18px;display:flex;flex-direction:column;gap:22px}.logo{font-size:30px;font-weight:900;letter-spacing:-2px;padding-left:12px}.logo span{color:#ff69a9}.sub{color:#9e95ba;font-size:12px;letter-spacing:2px;padding-left:13px}.nav{display:flex;flex-direction:column;gap:9px}.nav button,.bottomnav button{border:0;background:transparent;color:#aaa2c6;text-align:left;padding:15px 17px;border-radius:15px;font-weight:700}.nav button.active,.bottomnav button.active{background:linear-gradient(100deg,#a43cf4,#ed4a9b);color:white;box-shadow:0 8px 30px #b32fe044}.sidefoot{margin-top:auto;color:#8e85aa;font-size:12px;line-height:1.6;padding:10px}.main{flex:1;min-width:0;padding:32px 42px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{color:#e99df7;font-weight:800;letter-spacing:2px;font-size:11px}.top h1{font-size:35px;letter-spacing:-1.5px;margin:8px 0 5px}.muted{color:#a9a0c0}.pill{background:#25183c;border:1px solid #ffffff1c;border-radius:50px;padding:11px 16px;font-weight:700;font-size:13px}.hero{margin-top:28px;border-radius:26px;background:linear-gradient(115deg,#8c36db,#dc438f 78%);padding:34px;position:relative;overflow:hidden;box-shadow:0 16px 40px #0004}.hero:after{content:'✦';position:absolute;right:35px;top:-44px;font-size:220px;opacity:.15}.hero h2{font-size:31px;margin:5px 0}.hero p{max-width:430px;line-height:1.6}.btn{background:linear-gradient(110deg,#aa43f3,#f04a9c);border:0;color:white;border-radius:13px;padding:12px 19px;font-weight:800}.btn.alt{background:#2d2347}.btn.small{padding:9px 12px;font-size:12px}.sectiontitle{font-size:22px;margin:30px 0 17px;letter-spacing:-.5px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{background:#19132e;border:1px solid #ffffff16;border-radius:22px;padding:20px;min-width:0}.roomicon{height:80px;border-radius:16px;background:linear-gradient(120deg,#5d2b93,#a93b83);display:grid;place-items:center;font-size:40px}.card h3{margin:16px 0 7px}.tag{display:inline-block;color:#f6c6ff;background:#ffffff14;border-radius:30px;padding:6px 10px;font-size:11px}.row{display:flex;align-items:center;gap:12px}.avatar{width:54px;height:54px;border-radius:17px;background:linear-gradient(145deg,#9d4dff,#f35f97);display:grid;place-items:center;font-size:23px;font-weight:900;flex-shrink:0}.person{display:flex;align-items:center;gap:12px;justify-content:space-between}.person .info{flex:1;min-width:0}.person h3{margin:0 0 4px}.person p{margin:0;color:#a9a0c0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.people{display:grid;gap:12px}.chatlayout{display:grid;grid-template-columns:230px 1fr;gap:15px;height:520px}.chatlist{overflow:auto}.chatlist button{width:100%;text-align:left;border:0;color:white;background:#261d41;padding:12px;margin-bottom:7px;border-radius:12px}.chatbox{display:flex;flex-direction:column;min-height:0}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:12px 0}.bubble{max-width:78%;padding:12px 15px;background:#312446;border-radius:16px;align-self:flex-start;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:#a13cd9}.composer{display:flex;gap:8px}.input{background:#241c3c;border:1px solid #ffffff23;border-radius:13px;padding:13px;color:white;outline:none;min-width:0;width:100%}.input:focus{border-color:#ba67f3}textarea.input{resize:vertical}.form{display:grid;gap:13px;max-width:440px}.form label{font-size:13px;color:#c9bedc}.form label input,.form label textarea{margin-top:7px}.empty{color:#a9a0c0;padding:25px;background:#19132e;border-radius:16px}.authwrap{min-height:100vh;display:grid;place-items:center;padding:20px}.auth{max-width:430px;width:100%;padding:34px;background:#1a1230;border:1px solid #ffffff22;border-radius:25px}.auth h1{font-size:36px;margin:5px 0}.auth .form{margin-top:25px}.auth .switch{color:#e3a3ff;background:none;border:0;padding:10px 0}.notice{background:#301c4b;border:1px solid #bd69ef55;border-radius:12px;padding:13px;color:#efc9ff;font-size:13px;line-height:1.5}.error{color:#ff9eac;font-size:13px}.bottomnav{display:none}.hidden{display:none!important}@media(max-width:850px){.side{display:none}.main{padding:22px 18px 100px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#171029f5;border-top:1px solid #ffffff20;justify-content:space-around;padding:7px 4px env(safe-area-inset-bottom);z-index:5}.bottomnav button{text-align:center;padding:10px 8px;font-size:12px;border-radius:11px}.top h1{font-size:28px}.hero{padding:24px}.hero h2{font-size:25px}}@media(max-width:540px){.grid{grid-template-columns:1fr}.chatlayout{grid-template-columns:1fr;height:auto}.chatlist{display:flex;overflow:auto;gap:6px}.chatlist button{white-space:nowrap;width:auto}.chatbox{height:460px}.pill{font-size:11px;padding:9px}.top h1{font-size:25px}}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let me=null,tab='home',people=[],friends=[],rooms=[],chatWith=null,authMode='register';const api=async(path,body)=>{let r=await fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:body===undefined?undefined:JSON.stringify(body)});let x=await r.json();if(!r.ok)throw Error(x.error||'Something went wrong');return x};function msg(s){alert(s)}
function loginUI(){let register=authMode==='register';$('#app').innerHTML=`<div class="authwrap"><div class="auth"><div class="logo">MIN<span>GLE</span> ✦</div><p class="muted">Meet people. Share moments. Find your vibe.</p><h1>${register?'Create account':'Welcome back'}</h1><p class="muted">Your new friendships start here 💜</p><form class="form" id="authform">${register?'<label>Your name<input class="input" name="name" minlength="2" maxlength="40" required placeholder="What should we call you?"></label>':''}<label>Email<input class="input" name="email" type="email" required placeholder="you@example.com"></label><label>Password<input class="input" name="password" type="password" minlength="6" required placeholder="At least 6 characters"></label><div id="autherror" class="error"></div><button class="btn">${register?'Sign up':'Log in'} →</button></form><button class="switch" id="toggle">${register?'Already have an account? Log in':'New here? Create an account'}</button><div class="notice">🔒 Local demo server: your account and messages are stored on this computer. Do not expose this demo publicly.</div></div></div>`;$('#toggle').onclick=()=>{authMode=register?'login':'register';loginUI()};$('#authform').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{me=(await api(register?'register':'login',d)).user;await load();render()}catch(err){$('#autherror').textContent=err.message}}}
const icons={home:'⌂',rooms:'🎙',discover:'✦',chat:'💬',profile:'👤'};function nav(){return Object.keys(icons).map(k=>`<button data-tab="${k}" class="${tab===k?'active':''}">${icons[k]} ${k==='home'?'Home':k==='rooms'?'Voice Rooms':k==='discover'?'Discover':k==='chat'?'Messages':'My Profile'}</button>`).join('')}
function shell(content,title='Find your vibe ✨',subtitle='Meet people who get you.'){let n=nav();$('#app').innerHTML=`<div class="shell"><aside class="side"><div><div class="logo">MIN<span>GLE</span> ✦</div><div class="sub">FIND YOUR PEOPLE</div></div><nav class="nav">${n}</nav><div class="sidefoot">MINGLE community preview<br>Be kind • Stay safe • Have fun</div></aside><main class="main"><div class="top"><div><div class="eyebrow">WELCOME TO MINGLE</div><h1>${title}</h1><div class="muted">${subtitle}</div></div><div class="pill">💜 ${esc(me.name)}</div></div>${content}</main></div><div class="bottomnav">${n}</div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function roomCard(r,i){return `<div class="card"><div class="roomicon">${['🎙️','🎵','🌙','🤝','🎮','☕'][i%6]}</div><h3>${esc(r.title)}</h3><p class="muted">${esc(r.category)} • Hosted by ${esc(r.host)}</p><p><span class="tag">Audio room preview</span></p><button class="btn small" data-room="${r.id}">Explore room →</button></div>`}
function peopleCards(list){return list.length?`<div class="people">${list.map(p=>`<div class="card person"><div class="avatar">${esc(p.initial)}</div><div class="info"><h3>${esc(p.name)}</h3><p>${esc(p.bio||'Here to make new friends!')}</p></div><button class="btn small" data-friend="${p.id}">+ Friend</button><button class="btn alt small" data-chat="${p.id}">Chat</button></div>`).join('')}</div>`:'<div class="empty">No other members yet. Open MINGLE on another device and create another account to see friends here.</div>'}
function bind(){document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>msg('🎙️ Live voice audio is not enabled in this starter build. Room interface is a preview.'));document.querySelectorAll('[data-friend]').forEach(b=>b.onclick=async()=>{try{await api('friend',{id:Number(b.dataset.friend)});await load();msg('Friend added! 💜')}catch(e){msg(e.message)}});document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{chatWith=Number(b.dataset.chat);tab='chat';render()})}
async function load(){[people,friends,rooms]=await Promise.all([api('people').then(x=>x.people),api('friends').then(x=>x.friends),api('rooms').then(x=>x.rooms)])}
function render(){if(!me)return loginUI();if(tab==='home'){shell(`<div class="hero"><div class="eyebrow">✨ YOUR COMMUNITY AWAITS</div><h2>Good friends. Great conversations.</h2><p>Discover friendly people, explore lively rooms, and start conversations that matter.</p><button class="btn alt" id="explore">Explore people →</button></div><h2 class="sectiontitle">🎙️ Trending rooms</h2><div class="grid">${rooms.slice(0,3).map(roomCard).join('')}</div><h2 class="sectiontitle">🤝 New people</h2>${peopleCards(people.slice(0,3))}`);$('#explore').onclick=()=>{tab='discover';render()};bind()}
if(tab==='rooms'){shell(`<h2 class="sectiontitle">Explore voice rooms</h2><div class="notice">🎧 Voice rooms are a UI preview in this version. Real group audio needs a WebRTC/audio service and deployment.</div><div class="grid" style="margin-top:18px">${rooms.map(roomCard).join('')}</div>`,'Voice rooms 🎙️','Find a conversation worth joining.');bind()}
if(tab==='discover'){shell(`<h2 class="sectiontitle">People in the community</h2>${peopleCards(people)}`,'Discover friends 🤝','Say hello to someone new.');bind()}
if(tab==='chat'){let selected=people.find(p=>p.id===chatWith)||friends.find(p=>p.id===chatWith);shell(`<h2 class="sectiontitle">Private messages</h2><div class="chatlayout"><div class="chatlist">${people.length?people.map(p=>`<button data-select="${p.id}">${esc(p.name)}</button>`).join(''):'<div class="muted">No users yet</div>'}</div><div class="card chatbox">${selected?`<h3 style="margin:0">💬 ${esc(selected.name)}</h3><div class="messages" id="messages"></div><form class="composer" id="send"><input class="input" name="body" maxlength="1000" placeholder="Type a message…" required><button class="btn">Send</button></form>`:'<div class="empty">Choose a person to start chatting.</div>'}</div></div>`,'Your messages 💬','Real messages saved in the local database.');document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{chatWith=Number(b.dataset.select);render()});if(selected){showMessages();$('#send').onsubmit=async e=>{e.preventDefault();let input=e.target.elements.body;try{await api('message',{to:chatWith,body:input.value});input.value='';await showMessages()}catch(err){msg(err.message)}}}}
if(tab==='profile'){shell(`<h2 class="sectiontitle">Your profile</h2><div class="card"><form class="form" id="profileform"><label>Display name<input class="input" name="name" minlength="2" maxlength="40" value="${esc(me.name)}" required></label><label>About you<textarea class="input" name="bio" maxlength="180" rows="4" placeholder="Tell people a little about yourself">${esc(me.bio)}</textarea></label><button class="btn">Save profile</button></form><hr style="border:0;border-top:1px solid #ffffff22;margin:25px 0"><p class="muted">Your friends: ${friends.length}</p><button class="btn alt" id="logout">Log out</button></div><h2 class="sectiontitle">Your friends</h2>${peopleCards(friends)}`,'My profile 👤','Make a great first impression.');$('#profileform').onsubmit=async e=>{e.preventDefault();try{let d=Object.fromEntries(new FormData(e.target));await api('profile',d);me={...me,...d};msg('Profile saved');render()}catch(err){msg(err.message)}};$('#logout').onclick=async()=>{await api('logout',{});me=null;loginUI()};bind()}}
async function showMessages(){let id=chatWith;try{let items=(await api('messages?with='+id)).messages;if(id!==chatWith)return;let el=$('#messages');if(!el)return;el.innerHTML=items.length?items.map(m=>`<div class="bubble ${m.sender===me.id?'mine':''}">${esc(m.body)}<div style="font-size:10px;opacity:.65;margin-top:5px">${esc(m.created)}</div></div>`).join(''):'<div class="muted">No messages yet. Say hi 👋</div>';el.scrollTop=el.scrollHeight}catch(e){}}
(async()=>{try{me=(await api('me')).user;if(me)await load()}catch(e){}render()})();setInterval(()=>{if(me&&tab==='chat'&&chatWith)showMessages()},3500);
</script></body></html>
